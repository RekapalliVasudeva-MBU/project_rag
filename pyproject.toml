[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethermind-rag"
version = "0.2.0"
description = "AetherMind Web RAG Backend - Hybrid Docling + BM25 + RRF + CrossEncoder rerank"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "RekapalliVasudeva-MBU", email = "valte@example.com"}
]
maintainers = [
    {name = "RekapalliVasudeva-MBU", email = "valte@example.com"}
]
keywords = ["rag", "docling", "chromadb", "fastapi", "openrouter", "hybrid-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyMuPDF>=1.24.0,<2",
    "docling>=1.0.0,<2",
    "torch>=2.0.0,<3",
    "transformers>=4.36.0,<5",
    "chromadb>=0.4.0,<1",
    "sentence-transformers>=2.2.0,<3",
    "pillow>=10.0.0,<11",
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.29.0,<1",
    "sse-starlette>=2.0.0,<3",
    "python-multipart>=0.0.9,<1",
    "psycopg2-binary>=2.9.0,<3",
    "rank-bm25>=0.2.0,<1",
    "openai>=1.0.0,<2",
    "python-dotenv>=1.0.0,<2",
    "rich>=14.3.0,<15",
    "tqdm>=4.0.0,<5",
    "gunicorn>=21.0.0,<22",
    "opentelemetry-api>=1.20.0,<2",
    "opentelemetry-sdk>=1.20.0,<2",
    "opentelemetry-exporter-console>=1.20.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<6",
    "httpx>=0.27.0,<1",
    "ruff>=0.5.0,<1",
    "mypy>=1.10.0,<2",
]
eval = [
    "ollama>=0.3.0,<1",
]

[project.urls]
Homepage = "https://github.com/RekapalliVasudeva-MBU/project_rag"
Repository = "https://github.com/RekapalliVasudeva-MBU/project_rag"
Issues = "https://github.com/RekapalliVasudeva-MBU/project_rag/issues"

[project.scripts]
aethermind-rag = "server:main"
rag-ingest = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]  # line too long (handled by formatter)
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"