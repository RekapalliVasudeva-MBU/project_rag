services:
  - type: web
    name: aethermind-rag
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAG_PDF_SOURCE
        value: github
      - key: RAG_GITHUB_REPO
        value: ""
      - key: RAG_GITHUB_PATH
        value: pdfs
