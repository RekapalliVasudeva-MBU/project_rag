# =============================================================================
# GitHub Actions: Build, test, and push Docker image to GHCR
# Triggers: push to main, PR to main, manual dispatch
# =============================================================================

name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'main.py'
      - 'web_ui/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server.py'
      - 'main.py'
      - 'web_ui/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Verify image
        if: github.event_name != 'pull_request'
        run: |
          echo "Image pushed to ${{ steps.meta.outputs.tags }}"
          docker pull ${{ steps.meta.outputs.tags }}

  test-image:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Pull built image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run container health check
        run: |
          docker run -d --name test-container -p 8000:8000 \
            -e OPENROUTER_API_KEY=dummy \
            -e RAG_PDF_SOURCE=local \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Wait for startup
        run: sleep 15

      - name: Test health endpoint
        run: |
          curl -f http://localhost:8000/healthz || exit 1
          curl -f http://localhost:8000/api/health | jq '.status == "ok"' || exit 1

      - name: Test chat endpoint (expects error due to dummy key)
        run: |
          response=$(curl -s -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"question": "test"}')
          echo "$response" | grep -q "OpenRouter API key not configured" || exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f test-container || true